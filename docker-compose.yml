services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nestjs:
    build: ./nestjs-backend
    ports: ["3001:3001"]
    env_file: ./nestjs-backend/.env
    # These override whatever is in .env: inside the compose network the other
    # services are reachable by service name, never by localhost.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STT_SERVICE_URL: http://stt-tts:8001
      TTS_SERVICE_URL: http://stt-tts:8001
      LEADS_SERVICE_URL: http://leads-service:8002
      BUSINESS_SERVICE_URL: http://business-service:8003
      LLM_SERVICE_URL: http://llm-service:8004
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  nextjs:
    build: ./nextjs-frontend
    ports: ["3000:3000"]
    env_file: ./nextjs-frontend/.env.local
    depends_on: [nestjs]
    restart: unless-stopped

  stt-tts:
    build: ./python-services/stt-tts-service
    ports: ["8001:8001"]
    # models/ holds the Whisper + VITS checkpoints; see the service README.
    volumes: ["./python-services/stt-tts-service/models:/app/models"]
    environment:
      # Languages that serve the fine-tuned voice instead of base MMS, e.g.
      # "en,de" or "all". Set from eval_tts.py's output; empty = base everywhere.
      TTS_FINETUNED_LANGS: ${TTS_FINETUNED_LANGS:-}
    restart: unless-stopped

  leads-service:
    build: ./python-services/leads-service
    ports: ["8002:8002"]
    # model/ (singular) is what main.py reads — keep the mount in sync with it.
    volumes: ["./python-services/leads-service/model:/app/model"]
    restart: unless-stopped

  business-service:
    build: ./python-services/business-service
    ports: ["8003:8003"]
    environment:
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    volumes: ["./python-services/business-service/model:/app/model"]
    restart: unless-stopped

  llm-service:
    build: ./python-services/llm-service
    ports: ["8004:8004"]
    volumes: ["./python-services/llm-service/models:/app/models"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf"]
    depends_on: [nestjs, nextjs]
    restart: unless-stopped
