version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: marketing_user
      POSTGRES_PASSWORD: marketing_pass
      POSTGRES_DB: marketing_platform
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped

  nestjs:
    build: ./nestjs-backend
    ports: ["3001:3001"]
    env_file: ./nestjs-backend/.env
    depends_on: [postgres, redis]
    restart: unless-stopped

  nextjs:
    build: ./nextjs-frontend
    ports: ["3000:3000"]
    env_file: ./nextjs-frontend/.env.local
    depends_on: [nestjs]
    restart: unless-stopped

  stt-tts:
    build: ./python-services/stt-tts-service
    ports: ["8001:8001"]
    volumes: ["./python-services/stt-tts-service/models:/app/models"]
    restart: unless-stopped

  leads-service:
    build: ./python-services/leads-service
    ports: ["8002:8002"]
    volumes: ["./python-services/leads-service/models:/app/models"]
    restart: unless-stopped

  business-service:
    build: ./python-services/business-service
    ports: ["8003:8003"]
    volumes: ["./python-services/business-service/models:/app/models"]
    restart: unless-stopped

  llm-service:
    build: ./python-services/llm-service
    ports: ["8004:8004"]
    volumes: ["./python-services/llm-service/models:/app/models"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf"]
    depends_on: [nestjs, nextjs]
    restart: unless-stopped

volumes:
  postgres_data:
